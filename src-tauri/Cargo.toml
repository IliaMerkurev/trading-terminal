[package]
name = "trading-terminal"
version = "0.6.0-dev"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
windows = { version = "=0.61.3", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_System_WinRT"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
